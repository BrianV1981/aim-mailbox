[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aim-mailbox"
version = "0.3.0"
description = "A-Mail (amail / aim-mail): Zero-daemon, zero-LLM local Maildir post office and cross-OS wake dispatcher for AI coding agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
  {name = "Brian Vasquez"}
]
keywords = ["a-mail", "amail", "aim-mail", "ai-agents", "mailbox", "maildir", "cli", "orchestration", "multi-agent", "windows", "wsl"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
amail = "aim_mailbox.cli:main"
aim-mail = "aim_mailbox.cli:main"

[project.urls]
Homepage = "https://github.com/BrianV1981/aim-mailbox"
Ecosystem = "https://github.com/BrianV1981/aim-ecosystem"
Issues = "https://github.com/BrianV1981/aim-mailbox/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
